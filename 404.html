<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found · Budget Buddy</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f39c12'/%3E%3Crect x='12' y='20' width='40' height='28' rx='6' fill='%23fff'/%3E%3C/svg%3E" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      background: #f7f7f7;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      text-align: center;
    }

    .code {
      margin: 0;
      color: #f39c12;
      font-size: 4rem;
      font-weight: bold;
      line-height: 1;
    }

    h1 {
      margin: 12px 0 8px;
    }

    p {
      color: #666;
    }

    a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 20px;
      border-radius: 4px;
      background: #f39c12;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #1a5276;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <p class="code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p>There's nothing at this address.</p>
  <a id="home" href="/">Back to Budget Buddy</a>
  <script>
    // GitHub Pages project sites live under /<repo>/, not at the domain root.
    if (location.hostname.endsWith("github.io")) {
      document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
    }
  </script>
</body>
</html>
